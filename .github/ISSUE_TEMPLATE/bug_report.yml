name: Bug report
description: Report a reproducible problem with langchain-codex.
title: "bug: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: langchain-codex version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "20.19.0"
    validations:
      required: true
  - type: input
    id: langchain
    attributes:
      label: "@langchain/core version"
      placeholder: "1.1.41"
  - type: input
    id: codex
    attributes:
      label: "@openai/codex-sdk version"
      placeholder: "0.125.0"
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal code or steps to reproduce the issue.
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior

